comment:
  layout: "reach, diff, flags, files"
  behavior: default
  branches:
    - "develop"

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        if_ci_failed: error
        flags:
          - fearless
    patch:
      default:
        target: auto
        threshold: 0%
        if_ci_failed: error
        flags:
          - fearless

ignore:
  - "**/*View.swift"
  - "**/*Factory.swift"
  - "**/*ViewController.swift"
  - "**/*Cell.swift"
  - "**/*Wireframe.swift"
  - "fearless/Common/Protocols"
  - "fearless/Common/View"
  - "fearless/Common/ViewController"
