# XcodeGen spec for the Fearless Wallet macOS app.
# Regenerate the project with `xcodegen` in this folder after editing.
name: FearlessMac
options:
  bundleIdPrefix: jp.co.soramitsu
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
packages:
  WalletCore:
    path: Packages/WalletCore
  FearlessMacUI:
    path: Packages/FearlessMacUI
  FearlessMacEngine:
    path: Packages/FearlessMacEngine
targets:
  FearlessMac:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
          - "*.entitlements"
    dependencies:
      - package: WalletCore
      - package: FearlessMacUI
        product: WalletUI
      - package: FearlessMacEngine
        product: WalletEngine
    settings:
      base:
        PRODUCT_NAME: Fearless
        PRODUCT_BUNDLE_IDENTIFIER: jp.co.soramitsu.fearlesswallet.mac
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/FearlessMac.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        COMBINE_HIDPI_IMAGES: YES
        GENERATE_INFOPLIST_FILE: NO
  FearlessMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests
    dependencies:
      - target: FearlessMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.co.soramitsu.fearlesswallet.mac.uitests
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FearlessMac
schemes:
  FearlessMac:
    build:
      targets:
        FearlessMac: all
        FearlessMacUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FearlessMacUITests
    archive:
      config: Release
