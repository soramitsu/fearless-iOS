name: Codecov Fearless

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      run_remote_integration_tests:
        description: "Run endpoint-dependent integration tests"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub auth for private SwiftPM dependencies (optional)
        env:
          GH_READ_TOKEN: ${{ secrets.GH_READ_TOKEN }}
        run: |
          if [ -n "$GH_READ_TOKEN" ]; then
            echo "Using GH_READ_TOKEN for authenticated access to soramitsu/*"
            git config --global url."https://${GH_READ_TOKEN}:x-oauth-basic@github.com/soramitsu/".insteadOf "https://github.com/soramitsu/"
          else
            echo "GH_READ_TOKEN not set; proceeding without GitHub auth"
          fi
      
      - name: Bootstrap Dependencies
        run: |
          bash scripts/ci/bootstrap.sh

      - name: Verify Local Packages
        run: |
          bash scripts/test-local-packages.sh

      - name: Build & Test (Simulator)
        run: |
          set -o pipefail
          HOST_ARCH="$(uname -m)"
          case "$HOST_ARCH" in
            arm64)
              ;;
            *)
              echo "Unsupported Codecov runner architecture: $HOST_ARCH. Native crypto simulator builds require arm64." >&2
              exit 1
              ;;
          esac
          bash scripts/test-matrix.sh fearless.tests "platform=iOS Simulator,name=Any iOS Simulator Device"

      - name: Archive Smoke (Unsigned)
        run: |
          SKIP_BOOTSTRAP=1 bash scripts/ci/archive-smoke.sh "$PWD"

      - name: Remote Integration Tests (Manual)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_remote_integration_tests }}
        run: |
          FEARLESS_RUN_REMOTE_INTEGRATION_TESTS=1 SKIP_BOOTSTRAP=1 bash scripts/ci/remote-integration.sh "$PWD"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          fail_ci_if_error: true
          flags: fearless
          name: fearless-ios
          plugins: xcode
          swift_project: fearless
          use_oidc: true
